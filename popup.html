<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moskas Brain</title>
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <ellipse cx="16" cy="18" rx="5" ry="8" />
            <circle cx="16" cy="10" r="4" />
            <ellipse cx="9" cy="16" rx="6" ry="3" />
            <ellipse cx="23" cy="16" rx="6" ry="3" />
          </svg>
        </span>
        <div>
          <h1>Moskas Brain</h1>
          <p>Extensión experimental 0.1</p>
        </div>
      </header>

      <section id="fly-card" class="fly-card" hidden>
        <div class="fly-stage">
          <svg
            id="fly-avatar"
            class="fly-avatar"
            viewBox="0 0 220 140"
            role="img"
            aria-label="Tu mosca"
          >
            <!-- Copia adaptada del retrato original de apps/client/src/ui/fly-portrait.ts. -->
            <ellipse class="fly-shadow" cx="110" cy="120" rx="43" ry="7" />
            <g class="fly-motion">
              <g class="fly-tilt">
                <g class="fly-portrait-legs legs">
                  <path class="leg leg-1" d="M97 66 74 49 61 50" />
                  <path class="leg leg-2" d="M98 79 67 76 54 85" />
                  <path class="leg leg-3" d="M98 91 74 102 67 118" />
                  <path class="leg leg-4" d="M123 66 146 49 159 50" />
                  <path class="leg leg-5" d="M122 79 153 76 166 85" />
                  <path class="leg leg-6" d="M122 91 146 102 153 118" />
                </g>
                <g class="fly-body">
                  <ellipse class="abdomen" cx="110" cy="94" rx="16" ry="25" />
                  <path class="abdomen-band" d="M96 87h28m-29 9h30m-25 9h20" />
                  <ellipse class="thorax" cx="110" cy="67" rx="17" ry="19" />
                </g>
                <g class="wings">
                  <g class="wing wing-left">
                    <ellipse
                      cx="81"
                      cy="90"
                      rx="16"
                      ry="34"
                      transform="rotate(30 81 90)"
                    />
                  </g>
                  <g class="wing wing-right">
                    <ellipse
                      cx="139"
                      cy="90"
                      rx="16"
                      ry="34"
                      transform="rotate(-30 139 90)"
                    />
                  </g>
                </g>
                <g class="head">
                  <ellipse
                    class="head-shell"
                    cx="110"
                    cy="45"
                    rx="14"
                    ry="13"
                  />
                  <ellipse
                    class="eye eye-left"
                    cx="100"
                    cy="43"
                    rx="7"
                    ry="10"
                    transform="rotate(-15 100 43)"
                  />
                  <ellipse
                    class="eye eye-right"
                    cx="120"
                    cy="43"
                    rx="7"
                    ry="10"
                    transform="rotate(15 120 43)"
                  />
                  <path class="antenna antenna-left" d="M103 37 98 23" />
                  <path class="antenna antenna-right" d="M117 37 122 23" />
                  <path class="proboscis" d="M110 56 Q110 67 106 74" />
                </g>
              </g>
            </g>
          </svg>
        </div>
        <div class="fly-summary">
          <div>
            <p id="fly-action" class="action-pill">Descansando</p>
            <h2 id="fly-name">Tu mosca</h2>
            <p id="fly-status" class="fly-status"></p>
          </div>
          <div class="energy-readout">
            <span>Energía</span><strong id="energy-value">0%</strong>
          </div>
        </div>
        <div
          class="energy-track"
          role="meter"
          aria-label="Energía"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="energy-fill" class="energy-fill"></span>
        </div>
      </section>

      <div id="status" class="status" data-kind="idle">Detenida</div>
      <details id="connection" open>
        <summary>Conexión</summary>
        <div class="connection-form">
          <label
            >Servidor<input id="server" type="url" value="https://moscas.lol"
          /></label>
          <label
            >Token de dispositivo<input
              id="token"
              type="password"
              autocomplete="off"
              placeholder="fly_device_…"
          /></label>
          <p class="hint">
            El token queda guardado únicamente en este navegador.
          </p>
          <div class="actions">
            <button id="start" type="button">Iniciar cerebro</button>
            <button id="stop" class="secondary" type="button">Detener</button>
          </div>
        </div>
      </details>
      <p id="detail" class="detail" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
